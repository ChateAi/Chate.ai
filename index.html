<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NSFW Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Боковая панель -->
    <aside class="sidebar">
      <h2>NSFW Chat</h2>

      <div class="section">
        <label>Groq API Key</label>
        <input type="password" id="apiKey" placeholder="gsk_...">
        <button onclick="saveApiKey()">Сохранить ключ</button>
      </div>

      <div class="section">
        <label>Модель</label>
        <select id="modelSelect">
          <option value="llama-3.3-70b-versatile">Llama 3.3 70B</option>
          <option value="llama-3.1-70b-versatile">Llama 3.1 70B</option>
          <option value="llama-3.1-8b-instant">Llama 3.1 8B (быстрая)</option>
          <option value="mixtral-8x7b-32768">Mixtral 8x7B</option>
          <option value="gemma2-9b-it">Gemma 2 9B</option>
        </select>
      </div>

      <div class="section">
        <label>Характер</label>
        <select id="characterSelect" onchange="selectCharacter()"></select>
      </div>

      <div class="section">
        <button onclick="clearChat()" class="danger">Очистить чат</button>
      </div>
    </aside>

    <!-- Чат -->
    <main class="chat">
      <div id="messages" class="messages"></div>
      <div class="input-area">
        <textarea id="userInput" placeholder="Напиши сообщение..." rows="2"></textarea>
        <button onclick="sendMessage()">Отправить</button>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
